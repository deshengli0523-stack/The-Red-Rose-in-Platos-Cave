[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphifyy"
version = "0.4.11"
description = "AI coding assistant skill (Claude Code, Codex, OpenCode, Cursor, OpenClaw, Factory Droid, Trae) - turn any folder of code, docs, papers, images, or videos into a queryable knowledge graph"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["claude", "claude-code", "codex", "opencode", "cursor", "knowledge-graph", "rag", "graphrag", "obsidian", "community-detection", "tree-sitter", "leiden", "llm"]
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "tree-sitter>=0.23.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-ruby",
    "tree-sitter-c-sharp",
    "tree-sitter-kotlin",
    "tree-sitter-scala",
    "tree-sitter-php",
    "tree-sitter-swift",
    "tree-sitter-lua",
    "tree-sitter-zig",
    "tree-sitter-powershell",
    "tree-sitter-elixir",
    "tree-sitter-objc",
    "tree-sitter-julia",
]

[project.urls]
Homepage = "https://github.com/safishamsi/graphify"
Repository = "https://github.com/safishamsi/graphify"
Issues = "https://github.com/safishamsi/graphify/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
neo4j = ["neo4j"]
pdf = ["pypdf", "html2text"]
watch = ["watchdog"]
svg = ["matplotlib"]
leiden = ["graspologic; python_version < '3.13'"]
office = ["python-docx", "openpyxl"]
video = ["faster-whisper", "yt-dlp"]
all = ["mcp>=1.28.1,<2", "neo4j", "pypdf", "html2text", "watchdog", "graspologic; python_version < '3.13'", "python-docx", "openpyxl", "faster-whisper", "yt-dlp", "matplotlib"]
consultation-core = [
    "pydantic>=2.13.4,<3",
    "numpy>=1.26.4,<3",
    "jieba==0.42.1",
    "PyYAML>=6.0.2,<7",
    "pywin32>=312,<313; sys_platform == 'win32'",
]
consultation-ml = ["sentence-transformers>=5.6,<6"]
consultation-test = [
    "mcp[cli]>=1.28.1,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.8,<1",
    "mypy>=2.1,<3",
    "types-networkx>=3.6,<4",
    "types-pywin32>=312.0.0.20260609,<313; sys_platform == 'win32'",
    "pip-tools==7.5.3",
]

[project.scripts]
graphify = "graphify.__main__:main"
consultation-kb = "consultation_kb.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphify*", "consultation_kb*"]

[tool.setuptools.package-data]
graphify = ["skill.md", "skill-codex.md", "skill-opencode.md", "skill-aider.md", "skill-copilot.md", "skill-claw.md", "skill-windows.md", "skill-droid.md", "skill-trae.md"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = [
    "integration: consultation knowledge-base integration tests",
    "fault: consultation knowledge-base fault-injection tests",
    "golden: consultation knowledge-base golden-data tests",
    "model: consultation knowledge-base model-dependent tests",
    "slow: consultation knowledge-base slow tests",
    "acceptance_id(id): consultation knowledge-base acceptance contract ID",
]
